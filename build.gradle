plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.111'
}

version = "${mod_version}+${minecraft_version}"
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(21))
    }
}

repositories {
    mavenCentral()
}

neoForge {
    version = neo_version
    parchment {
        mappingsVersion = parchment_mappings_version
        minecraftVersion = parchment_minecraft_version
    }
    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all', '--output',
                    file('src/generated/resources/').absolutePath, '--existing',
                    file('src/main/resources/').absolutePath
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main {
    resources { srcDir 'src/generated/resources' }
    java {
        // PGen has no 1.21.1 artifact. Its generated Patchouli resources are checked
        // in, so the generator itself is not part of the production compilation.
        exclude 'org/crimsoncrips/alexscavesexemplified/datagen/ACExDatagen.java'
        exclude 'org/crimsoncrips/alexscavesexemplified/datagen/ACExRegistryDataGenerator.java'
        exclude 'org/crimsoncrips/alexscavesexemplified/datagen/advancement/**'
        exclude 'org/crimsoncrips/alexscavesexemplified/datagen/blockstate/**'
        exclude 'org/crimsoncrips/alexscavesexemplified/datagen/language/**'
        exclude 'org/crimsoncrips/alexscavesexemplified/datagen/loottables/ACExBlockDrops.java'
        exclude 'org/crimsoncrips/alexscavesexemplified/datagen/loottables/ACExLootGenerator.java'
        exclude 'org/crimsoncrips/alexscavesexemplified/datagen/loottables/ACExManualLoot.java'
        exclude 'org/crimsoncrips/alexscavesexemplified/datagen/patchouli/**'
        exclude 'org/crimsoncrips/alexscavesexemplified/datagen/recipe/**'
        exclude 'org/crimsoncrips/alexscavesexemplified/datagen/sounds/**'
        // Alex's Caves Enriched has no 1.21.1 port to compile or run against.
        exclude 'org/crimsoncrips/alexscavesexemplified/compat/ACEnrichedCompat.java'
        exclude 'org/crimsoncrips/alexscavesexemplified/mixins/external_misc/ACExRaygunMK2Mixin.java'
        exclude 'org/crimsoncrips/alexscavesexemplified/mixins/external_mobs/ACExNuclearExplosion2EntityMixin.java'
    }
}

def alexsCavesJar = file('../../AlexsCaves/build/libs/alexscaves-2.0.10.1.jar')
def packModsDir = file('../../Synesthesia Modpack/live-instance/mods')

dependencies {
    if (!alexsCavesJar.exists()) {
        throw new GradleException("Build Ashley's Alex's Caves fork first; missing ${alexsCavesJar}")
    }

    implementation files(alexsCavesJar)
    implementation files(new File(packModsDir, 'citadel-2.7.1-1.21.1.jar'))

    // Optional integrations are compile-only. The local pack supplies these exact
    // 1.21.1 NeoForge ports when present, without making the addon require them.
    compileOnly files(new File(packModsDir, 'alexsmobs-2.2.2-neoforge+1.21.1.jar'))
    compileOnly files(new File(packModsDir, 'curios-neoforge-9.5.1+1.21.1.jar'))
    compileOnly files(new File(packModsDir, 'create-1.21.1-6.0.10.jar'))
    compileOnly files(new File(packModsDir, 'Patchouli-1.21.1-93-NEOFORGE.jar'))
    compileOnly files(new File(packModsDir, 'supplementaries-1.21.1-3.9.9-neoforge.jar'))
    compileOnly files(new File(packModsDir, 'moonlight-1.21.1-3.6.4-neoforge.jar'))
    compileOnly files(new File(packModsDir, 'FarmersDelight-1.21.1-1.3.4.jar'))

    compileOnly annotationProcessor('io.github.llamalad7:mixinextras-common:0.5.4')
    implementation jarJar('io.github.llamalad7:mixinextras-neoforge:0.5.4')
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version: neo_version,
            neo_version_range: neo_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title': mod_id,
                'Specification-Vendor': mod_authors,
                'Specification-Version': '1',
                'Implementation-Title': project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor': mod_authors,
        ])
    }
    reproducibleFileOrder = true
    preserveFileTimestamps = false
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
